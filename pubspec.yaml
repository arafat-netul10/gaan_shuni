name: gaan_shuni
description: "A privacy-first, offline local music player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.0

  # Local storage — settings (key-value)
  shared_preferences: ^2.3.0

  # Local database — library data (structured)
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.0

  # Utilities
  path_provider: ^2.1.0
  path: ^1.9.0
  permission_handler: ^11.3.1
  on_audio_query_pluse: ^3.0.7
  audio_metadata_reader: ^1.8.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.22.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
